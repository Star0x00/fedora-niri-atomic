# Package groups, reinstall list, and remove list.

[packages]

# Packages pre-installed in the base image that must be removed and
# re-installed from the highest-priority repo (see README).
reinstall = []

remove = [
  'firefox',
  'firefox-langpacks',
  # base image (fedora-bootc:44) ships nfs-utils and preset-enables
  # nfs-client.target; drop the whole NFS/RPC family since nothing
  # else depends on it (no NFS shares are mounted here).
  'nfs-utils',
  'nfs-client-utils',
  'nfs-common-utils',
  'nfsv3-client-utils',
  'nfsv4-client-utils',
  'rpcbind',
  'gssproxy',
  'quota',
  'quota-nls',
  # zram swap is not wanted. zram-generator-defaults ships the default
  # /usr/lib/systemd/zram-generator.conf that creates /dev/zram0; the
  # defaults package Requires the generator, so both go together.
  # Disk swap (/dev/nvme0n1p3, 32G) remains available.
  'zram-generator',
  'zram-generator-defaults',
]

# Groups are installed in key order, so put the most stable, foundational
# packages first so they land in early (cached) layers, and the
# frequently-changing ones (desktop, gaming) last.
# Keep the group names in sync with the RUN layers in the Containerfile.
[packages.groups]

# foundational, very rarely churn (cached best)
system = [
  'mesa-vulkan-drivers',
]

fonts = [
  'google-noto-sans-fonts',
  'google-noto-sans-yi-fonts',
  'google-noto-serif-tibetan-fonts',
  'google-noto-emoji-fonts',
  'google-noto-color-emoji-fonts',
  'iosevka-custom-fonts',
]

# daemons / virtualization / audio / network
services = [
  # virtualization
  'qemu-kvm',
  'libvirt-daemon-kvm',
  'libvirt-daemon-config-network',
  'libvirt-client',
  'virt-install',
  'virt-manager',
  'virt-viewer',
  'edk2-ovmf',
  'swtpm',
  # audio
  'pipewire',
  'pipewire-utils',
  'wireplumber',
  'pipewire-alsa',
  'pipewire-pulseaudio',
  'mpd',
  # network
  'NetworkManager-wifi',
  'iwlwifi-mvm-firmware',
  # system daemons
  'upower',
]

# CLI / dev / container tooling
utils = [
  # package & container management
  'distrobox',
  'systemd-container',
  # graphics / system
  'vulkan-tools',
  'xdg-utils',
  "glibc-devel",
  "gcc",
  'glibc-langpack-en',
  'mise',
  'pass',
  'zmx',
  'go-musicfox',
  'mpv',
  'mineral',
  'playerctl',
  'gtk-murrine-engine',
  'zsh',
  'flow',
]

# GUI session, changes most often (cached worst)
desktop = [
  # window managers
  'niri',
  # theme
  'bibata-cursor-theme',
  'colloid-gtk-theme',
  'adw-gtk3-theme',
  # file managers
  'nautilus',
  # desktop portals
  'xdg-desktop-portal',
  'xdg-desktop-portal-gnome',
  'xdg-desktop-portal-gtk',
  # terminal emulators
  'monstar',
  'ghostty',
  # screenshot
  'grim',
  'slurp',
  'satty',
  # clipboard
  'cliphist',
  'noctalia-git',
  # input method (Chinese)
  'fcitx5',
  'fcitx5-configtool',
  'fcitx5-chinese-addons',
  'fcitx5-rime',
  # flatpak
  'flatpak',
  'vicinae',
  'gram',
  'helium-bin',
]

gaming = []

# flatpak remotes and systemd service state.

# each entry: `flatpak remote-add --if-not-exists <name> <url>`
[system.flatpak]
flathub = 'https://dl.flathub.org/repo/flathub.flatpakrepo'

[system.services]
enable = [
  # display manager (greetd + noctalia greeter); greetd.service carries the
  # display-manager.service alias
  'greetd.service',
  'bluetooth.service',
  'avahi-daemon.service',
  'fedora-repair-passwd.service',
  'plasmalogin-shadow-fix.service',
  # Bind mounts /var/nix on /nix before tmpfiles.d runs (root is a read-only
  # composefs overlay, and /var from the image is not applied on upgrades).
  # Runs before sysinit.target, so it is always up before nix-daemon.socket.
  'nix-prepare.service',
  # Nix multi-user store; socket-activated.
  'nix-daemon.socket',
]

disable = [
  'bootc-fetch-apply-updates.timer',
  # stamp-based workaround; superseded by plasmalogin-shadow-fix.service
  'fedora-kinoite-plasmalogin-workaround.service',
]

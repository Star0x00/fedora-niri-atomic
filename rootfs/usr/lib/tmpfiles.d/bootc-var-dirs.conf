# Declare /var dirs created by RPM %install scriptlets during the container
# build. bootc container lint requires all /var content to be listed here
# so systemd-tmpfiles recreates them correctly on first boot of a fresh
# deployment (where /var starts empty).
#
# Format: Type Path Mode User Group Age
d /var/lib/blueman                0755 root    root    -
d /var/lib/dnf                    0755 root    root    -
d /var/lib/geoclue                0755 geoclue geoclue -
d /var/cache/PackageKit           0755 root    root    -
d /var/cache/ibus                 0755 root    root    -
d /var/cache/ibus/bus             0755 root    root    -
d /var/cache/libX11               0755 root    root    -
d /var/cache/libX11/compose       0755 root    root    -
# greetd: %post creates .config/systemd/user (with a masked
# xdg-desktop-portal.service) under the greeter home; the dirs are not
# rpm-owned, so declare them for first boot of a fresh deployment.
d /var/lib/greetd                       0755 greetd greetd -
d /var/lib/greetd/.config               0755 greetd greetd -
d /var/lib/greetd/.config/systemd       0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user  0755 greetd greetd -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
# noctalia-greeter state (greeter.toml / sync.toml); owned by the account
# greetd runs the greeter as.
d /var/lib/noctalia-greeter       0750 greetd greetd -
